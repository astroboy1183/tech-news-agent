name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Vectorize and Workers AI have no local emulator, so the vitest pool
    # opens a remote proxy session — every step needs credentials, not just
    # the deploy. Job-level env keeps them in one place.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Migrations are forward-only and additive, so they run before the deploy.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply tech-news --remote

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$CODE" = "200" ]; then cat /tmp/health.json; exit 0; fi
            echo "attempt $i returned $CODE, retrying"; sleep 6
          done
          echo "health check never returned 200"; cat /tmp/health.json || true; exit 1
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
